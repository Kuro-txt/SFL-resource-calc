<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFL Resource Calculator</title>
  <link rel="icon" type="image/x-icon" href="./assets/flower.webp">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"VT323"', 'monospace'],
            game: ['"Fredoka"', 'sans-serif'],
          },
          colors: {
            sfl: {
              green: '#3e8914',
              dirt: '#2b1e17',
              wood: '#633d1f',
              woodLight: '#8a5832',
              card: '#fff3db',
              cardBorder: '#c49a6c',
              gold: '#f2a900',
              accent: '#e76f51'
            }
          }
        }
      }
    }

    if (localStorage.getItem('sfl_theme') === 'dark' || (!('sfl_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body class="font-game text-sfl-dirt min-h-screen p-4 sm:p-8 flex items-center justify-center transition-colors duration-200">

  <div class="w-full max-w-5xl space-y-4">
    <!-- Header Mount -->
    <div id="header-mount"></div>

    <div class="sfl-panel rounded-2xl p-5 sm:p-7 relative space-y-5">
      <!-- Auth Bar & Global Farm Sync Mount -->
      <div id="auth-mount"></div>
      
      <!-- Navigation Tabs Mount -->
      <div id="tabs-mount"></div>

      <!-- Views Containers -->
      <div id="calc-section"></div>
      <div id="crop-tracker-section" class="hidden"></div>
      <div id="trade-history-section" class="hidden"></div>
      <div id="npc-gifts-section" class="hidden"></div>
      <div id="wishlist-section" class="hidden"></div>
    </div>
  </div>

  <!-- Modal Mount Containers -->
  <div id="tracking-modal-mount"></div>
  <div id="weekly-modal-mount"></div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="./src/app.js"></script>

</body>
</html>
